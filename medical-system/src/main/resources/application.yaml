server:
  port: 8080

spring:
  application:
    name: medical-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowMultiQueries 关闭，配合 PreparedStatement 参数化，杜绝多语句注入
    url: jdbc:mysql://localhost:3306/medical_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowMultiQueries=false
    username: ${MYSQL_USERNAME:root}
    # 密码走环境变量，未配置时回退到本地开发密码，避免明文进仓库
    password: ${MYSQL_PASSWORD:123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    # 开启驼峰映射：dept_name -> deptName
    map-underscore-to-camel-case: true
    # 打印真实执行的 SQL，便于验证参数是否以 ? 占位符预编译
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 表字段与实体一致，无需额外注解
      table-underline: true

logging:
  level:
    com.medical.medical_system: debug
